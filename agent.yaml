spec_version: "0.1.0"
name: git-hotelrev
version: 1.0.0
description: "Autonomous Hospitality Revenue Management, RevPAR Optimization & Yield Pricing Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - hospitality-revenue-management
  - yield-pricing-algorithms

tools:
  - revpar-yield-calculator
  - dynamic-rate-optimizer
  - cancellation-buffer-estimator

runtime:
  max_turns: 50
  timeout: 120

tags:
  - hospitality
  - hotel-revenue
  - revpar-optimization
  - dynamic-pricing
  - passport-challenge

metadata:
  passport_id: "aps-hotelrev-01"
  passport_category: "Travel & hospitality"
