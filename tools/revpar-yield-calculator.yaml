name: revpar-yield-calculator
version: 1.0.0
description: "Computes RevPAR from Average Daily Rate (ADR) and Occupancy percentage"
input_schema:
  type: object
  properties:
    pms_metrics_json:
      type: string
      description: "JSON with adr_usd and occupancy_pct"
  required:
    - pms_metrics_json
implementation:
  type: script
  path: revpar_yield_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
